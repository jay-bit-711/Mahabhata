<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mahabharata</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap');
:root {
  --bg: #0a0908;
  --gold: #e4c07a;
  --cream: #f4efe6;
  --muted: #8a8175;
  --panel: #11100e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--cream); font-family: Inter, system-ui, sans-serif; overflow: hidden; }

#intro {
  position: fixed; inset: 0; z-index: 100;
  background: #050403;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  transition: opacity 1.4s cubic-bezier(.2,.8,.2,1), visibility 1.4s;
}
#intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.embers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.ember {
  position: absolute; width: 1.5px; height: 1.5px; background: #ff8a4a; border-radius: 50%;
  animation: rise 6s linear infinite; opacity: 0;
}
@keyframes rise {
  0% { transform: translateY(110vh) scale(0.4); opacity: 0; }
  10% { opacity: 0.8; }
  100% { transform: translateY(-10vh) scale(1.6); opacity: 0; }
}
.beam {
  position: absolute; width: 2px; height: 40vh; background: linear-gradient(to bottom, transparent, #e4c07a, transparent);
  left: 50%; top: 30%; transform: translateX(-50%) rotate(-15deg);
  opacity: 0; animation: beam 4.8s 0.6s ease-out forwards; filter: blur(1px);
}
@keyframes beam {
  0% { opacity: 0; transform: translateX(-50%) rotate(-15deg) scaleY(0.3); }
  40% { opacity: 0.6; }
  100% { opacity: 0; transform: translateX(-50%) rotate(-15deg) scaleY(1.2); }
}
.hero-title {
  font-family: "Instrument Serif", serif;
  font-size: clamp(4.2rem, 13vw, 8.5rem);
  font-weight: 400; letter-spacing: -0.04em; line-height: 0.88;
  color: var(--gold); text-align: center;
  animation: titleReveal 5.2s cubic-bezier(.15,.7,.2,1) forwards;
  text-shadow: 0 0 40px rgba(228,192,122,0.25);
}
@keyframes titleReveal {
  0% { opacity: 0; transform: scale(0.88) translateY(30px); filter: blur(12px); }
  35% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.06) translateY(-8px); filter: blur(2px); }
}
.hero-sub {
  margin-top: 1.4rem; font-size: 0.8rem; letter-spacing: 0.45em;
  text-transform: uppercase; color: var(--muted); opacity: 0;
  animation: fade 5.2s 1s forwards;
}
@keyframes fade { to { opacity: 0.7; } }

.app { height: 100%; display: flex; flex-direction: column; }
.top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px;
  background: rgba(10,9,8,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(228,192,122,0.12); z-index: 10;
}
.logo { font-family: "Instrument Serif", serif; font-size: 1.3rem; color: var(--gold); }
.icon { background: none; border: none; color: var(--cream); font-size: 1.35rem; cursor: pointer; opacity: 0.8; }
.lang-corner {
  display: flex; gap: 6px; align-items: center;
}
.lang-letter {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid rgba(228,192,122,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 500; cursor: pointer;
  transition: all .2s;
}
.lang-letter.on { background: var(--gold); color: #0a0908; border-color: var(--gold); }

.main { flex: 1; overflow-y: auto; padding: 24px 20px 110px; }
.hierarchy {
  display: flex; align-items: center; gap: 10px;
  font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em;
  margin-bottom: 20px;
}
.hierarchy span { color: var(--gold); }
.hierarchy .sep { opacity: 0.4; }

.mode-icons {
  display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
}
.mode-icon {
  width: 42px; height: 42px; border-radius: 12px;
  border: 1px solid rgba(228,192,122,0.2);
  background: #161412;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; cursor: pointer; transition: all .2s;
}
.mode-icon.on { background: var(--gold); color: #0a0908; border-color: var(--gold); }

.episode h2 {
  font-family: "Instrument Serif", serif;
  font-size: 2rem; font-weight: 400; margin-bottom: 4px;
}
.episode .loc { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; }
.block {
  margin-bottom: 32px;
  opacity: 0; transform: translateY(20px);
  transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);
}
.block.visible { opacity: 1; transform: translateY(0); }
.visual {
  width: 100%; aspect-ratio: 16/9; background: #161412;
  border-radius: 12px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: center;
  color: #555; font-size: 0.75rem; text-align: center; padding: 16px;
  border: 1px solid #222;
}
.sa { font-family: "Noto Serif Devanagari", serif; font-size: 1.2rem; line-height: 1.7; }
.en, .te { margin-top: 12px; line-height: 1.6; color: #ddd; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .35s; }
.overlay.on { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; bottom: 0; width: min(360px, 86vw);
  background: var(--panel); z-index: 210; padding: 28px 20px; overflow-y: auto;
  transition: transform .45s cubic-bezier(.2,.8,.2,1);
  border: 1px solid rgba(228,192,122,0.1);
}
.panel.left { left: 0; transform: translateX(-100%); }
.panel.right { right: 0; transform: translateX(100%); }
.panel.on { transform: translateX(0); }
.panel h3 { font-family: "Instrument Serif", serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 20px; }
.panel button {
  display: block; width: 100%; text-align: left; background: none; border: none;
  color: var(--cream); padding: 14px 0; border-bottom: 1px solid #222;
  font-size: 0.95rem; cursor: pointer;
}
.panel button:hover { color: var(--gold); }
.deep { margin-top: 40px; font-size: 0.72rem; color: #555; line-height: 1.5; }

.hud {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(10,9,8,0.92); backdrop-filter: blur(16px);
  border-top: 1px solid rgba(228,192,122,0.15);
  padding: 10px 0 14px; z-index: 20;
}
.hud-item {
  background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; min-width: 64px;
}
.hud-item .ico { font-size: 1.3rem; }
.hud-item.on { color: var(--gold); }
</style>
</head>
<body>

<div id="intro">
  <div class="embers" id="embers"></div>
  <div class="beam"></div>
  <div class="hero-title">Mahabharata</div>
  <div class="hero-sub">An Epic Retold</div>
</div>

<div class="app">
  <div class="top">
    <button class="icon" onclick="openP('left')">☰</button>
    <div class="logo">Mahabharata</div>
    <div class="lang-corner">
      <div class="lang-letter on" data-l="sa" title="Sanskrit">स</div>
      <div class="lang-letter" data-l="en" title="English">E</div>
      <div class="lang-letter" data-l="te" title="Telugu">తె</div>
      <div class="lang-letter" data-l="all" title="All">A</div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="hierarchy" id="hier">
      <span>Adi Parva</span><span class="sep">·</span>
      <span>Adhyaya 1</span><span class="sep">·</span>
      <span>Block 1/4</span>
    </div>

    <div class="mode-icons" id="modes">
      <div class="mode-icon on" data-m="anime" title="Anime">🎬</div>
      <div class="mode-icon" data-m="manga" title="Manga">📖</div>
      <div class="mode-icon" data-m="cartoon" title="Cartoon">🐼</div>
      <div class="mode-icon" data-m="short" title="Short Story">✍️</div>
      <div class="mode-icon" data-m="gif" title="GIF">🎬</div>
      <div class="mode-icon" data-m="text" title="Text">Aa</div>
    </div>

    <div id="episode"></div>
  </div>

  <div class="hud">
    <button class="hud-item on"><div class="ico">📖</div>Read</button>
    <button class="hud-item"><div class="ico">🗺️</div>Map</button>
    <button class="hud-item"><div class="ico">⏱️</div>Path</button>
    <button class="hud-item" onclick="openP('right')"><div class="ico">⚙️</div>More</button>
  </div>
</div>

<div class="overlay" id="ov" onclick="closeP()"></div>
<div class="panel left" id="left">
  <h3>Adhyayas</h3>
  <button onclick="load(1)">1 · Naimisha</button>
  <button onclick="load(2)">2 · Coming</button>
  <button onclick="load(3)">3 · Coming</button>
  <div class="deep">Swipe or select to move between Adhyayas.</div>
</div>
<div class="panel right" id="right">
  <h3>Player</h3>
  <button>Reading Mode</button>
  <button>Resume</button>
  <button>Forums</button>
  <button>Suggestions</button>
  <div class="deep">Support<br>jayanthedara1@ybl<br>₹10 / ₹15</div>
</div>

<script>
const embers = document.getElementById('embers');
for (let i = 0; i < 70; i++) {
  const e = document.createElement('div');
  e.className = 'ember';
  e.style.left = Math.random() * 100 + '%';
  e.style.animationDelay = Math.random() * 5 + 's';
  e.style.animationDuration = (4 + Math.random() * 4) + 's';
  embers.appendChild(e);
}
setTimeout(() => document.getElementById('intro').classList.add('hide'), 5200);

const data = {
  1: {
    title: "Adhyaya 1",
    loc: "Anukramanika",
    hier: ["Adi Parva", "Adhyaya 1", "Block"],
    blocks: [
      {
        v: "Visual — Sauti approaching the Naimisha satra",
        sa: "नारायणं नमस्कृत्य नरं चैव नरोत्तमम्।\nदेवीं सरस्वतीं चैव ततो जयमुदीरयेत् ॥",
        en: "Having bowed to Narayana and Nara the foremost of men, and to Sarasvati, then let Jaya be uttered.",
        te: "నారాయణుని, నరోత్తమునైన నరుని, సరస్వతిని నమస్కరించి తరువాత जयను ఉదీరించవలి."
      },
      {
        v: "Visual — Sages seated at the twelve-year satra",
        sa: "",
        en: "In the Naimisha forest, at the twelve-year sacrifice of Kulapati Shaunaka, the sages sat at ease.",
        te: "నైమిషారణ్యంలో శ౗నక కులపతి యొక్క ప్రారంభించిన ప్రతిజ్ఞాన సత్రంలో మహర్షులు కూర్చున్నారు."
      },
      {
        v: "Visual — Ugrasrava Sauti arrives with humility",
        sa: "",
        en: "Ugrasrava, son of Lomaharshana, a Sauti skilled in the Puranas, approached them with humility.",
        te: "లోమహర్షణ పుత్రుడైన ఉగ్రశ్రవుడు వినయముగా వారి సమీపించాడు."
      },
      {
        v: "Visual — The request to narrate the great Bharata",
        sa: "",
        en: "The sages welcomed him and requested the narration of the great history of the Bharatas.",
        te: "మహర్షులు ఆయనను స్వాగతించి మహాభారత కథను అడిగారు."
      }
    ]
  }
};

let mode = 'anime', lang = 'all', ch = 1;

function revealBlocks() {
  const blocks = document.querySelectorAll('.block');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 100);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  blocks.forEach(b => observer.observe(b));
}

function render() {
  const c = data[ch];
  document.getElementById('hier').innerHTML =
    `<span>${c.hier[0]}</span><span class="sep">·</span><span>${c.hier[1]}</span><span class="sep">·</span><span>Block 1/${c.blocks.length}</span>`;

  let h = `<div class="episode"><h2>${c.title}</h2><div class="loc">${c.loc}</div>`;
  c.blocks.forEach(b => {
    h += `<div class="block"><div class="visual">${b.v}</div>`;
    if (lang === 'all' || lang === 'sa') h += `<p class="sa">${b.sa}</p>`;
    if (lang === 'all' || lang === 'en') h += `<p class="en">${b.en}</p>`;
    if (lang === 'all' || lang === 'te') h += `<p class="te">${b.te}</p>`;
    h += '</div>';
  });
  h += '</div>';
  document.getElementById('episode').innerHTML = h;
  localStorage.setItem('mb', JSON.stringify({ch, mode, lang}));
  setTimeout(revealBlocks, 40);
}

function setM(m) {
  mode = m;
  document.querySelectorAll('.mode-icon').forEach(x => x.classList.toggle('on', x.dataset.m === m));
  render();
}
function setL(l) {
  lang = l;
  document.querySelectorAll('.lang-letter').forEach(x => x.classList.toggle('on', x.dataset.l === l));
  render();
}
function load(n) {
  if (!data[n]) return alert('Coming');
  ch = n; closeP(); render();
}
function openP(s) {
  document.getElementById('ov').classList.add('on');
  document.getElementById(s).classList.add('on');
}
function closeP() {
  document.getElementById('ov').classList.remove('on');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
}

document.querySelectorAll('.mode-icon').forEach(c => c.onclick = () => setM(c.dataset.m));
document.querySelectorAll('.lang-letter').forEach(c => c.onclick = () => setL(c.dataset.l));

const s = localStorage.getItem('mb');
if (s) {
  const o = JSON.parse(s);
  ch = o.ch || 1; mode = o.mode || 'anime'; lang = o.lang || 'all';
}
render();
</script>
</body>
</html>
