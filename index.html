<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mahabharata · Modes</title>
<style>
:root { --bg:#0f0d0b; --gold:#e8c36a; --accent:#b45309; --card:#fff; --text:#1c1917; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:#eee; font-family:system-ui,-apple-system,sans-serif; height:100dvh; overflow:hidden; }

.app { height:100%; display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#1a1612; border-bottom:1px solid #333; }
.top h1 { font-size:1.1rem; color:var(--gold); font-weight:500; }
.icon-btn { background:transparent; border:none; color:#ccc; font-size:1.3rem; cursor:pointer; padding:6px; }

.main { flex:1; overflow-y:auto; padding:16px; background:#faf8f5; color:var(--text); }
.progress-bar { height:4px; background:#eee; border-radius:2px; margin-bottom:16px; }
.progress-fill { height:100%; background:var(--accent); width:8%; border-radius:2px; transition:width .3s; }
.meta { display:flex; justify-content:space-between; font-size:.8rem; color:#666; margin-bottom:12px; }

.mode-pills, .lang-pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.pill { background:#fff; border:1px solid #ddd; padding:6px 12px; border-radius:20px; font-size:.78rem; cursor:pointer; }
.pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }

.episode { background:#fff; border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
.episode h2 { font-size:1.05rem; color:var(--accent); margin-bottom:8px; }
.visual-slot { width:100%; height:160px; background:#f0eee9; border-radius:10px; margin:10px 0; display:flex; align-items:center; justify-content:center; color:#999; font-size:.8rem; text-align:center; padding:10px; }
.sa { font-family:"Noto Serif Devanagari",serif; font-size:1.15rem; line-height:1.65; }
.te { font-family:"Noto Sans Telugu",sans-serif; }

/* Side panels */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:80; display:none; }
.overlay.on { display:block; }
.panel { position:fixed; top:0; bottom:0; width:min(320px,85vw); background:#fff; color:var(--text); z-index:90; transition:transform .3s; padding:20px 16px; overflow-y:auto; }
.panel.left { left:0; transform:translateX(-100%); }
.panel.right { right:0; transform:translateX(100%); }
.panel.on { transform:translateX(0); }
.panel h3 { color:var(--accent); margin-bottom:12px; }
.panel button, .panel a { display:block; width:100%; text-align:left; background:none; border:none; padding:12px 0; border-bottom:1px solid #eee; font-size:.95rem; cursor:pointer; color:inherit; }
.deep { margin-top:40px; font-size:.8rem; color:#999; }

.bottom-nav { display:flex; background:#1a1612; border-top:1px solid #333; }
.bottom-nav button { flex:1; background:none; border:none; color:#ccc; padding:12px; font-size:.75rem; cursor:pointer; }
.bottom-nav button.on { color:var(--gold); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="icon-btn" onclick="openPanel('left')">☰</button>
    <h1>Mahabharata</h1>
    <button class="icon-btn" onclick="openPanel('right')">⋮</button>
  </div>

  <div class="main" id="main">
    <div class="meta">
      <span id="location">Adi Parva · Adhyaya 1</span>
      <span id="progress-text">Progress 8%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>

    <div class="mode-pills" id="modes">
      <button class="pill on" data-mode="anime">Anime</button>
      <button class="pill" data-mode="manga">Manga</button>
      <button class="pill" data-mode="cartoon">Cartoon</button>
      <button class="pill" data-mode="short">Short Story</button>
      <button class="pill" data-mode="gif">GIF Only</button>
      <button class="pill" data-mode="text">Text Only</button>
    </div>

    <div class="lang-pills" id="langs">
      <button class="pill on" data-lang="all">All</button>
      <button class="pill" data-lang="sa">Sanskrit</button>
      <button class="pill" data-lang="en">English</button>
      <button class="pill" data-lang="te">Telugu</button>
    </div>

    <div id="content"></div>
  </div>

  <div class="bottom-nav">
    <button class="on">Read</button>
    <button onclick="alert('Parva Map — Coming')">Map</button>
    <button onclick="alert('Progress saved')">Progress</button>
    <button onclick="openPanel('right')">More</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanels()"></div>

<div class="panel left" id="left">
  <h3>Chapters</h3>
  <button onclick="loadChapter(1)">Adhyaya 1 — Naimisha</button>
  <button onclick="loadChapter(2)">Adhyaya 2 — Coming</button>
  <button onclick="loadChapter(3)">Adhyaya 3 — Coming</button>
  <div class="deep">More Parvas unlock as you progress</div>
</div>

<div class="panel right" id="right">
  <h3>Modes & Settings</h3>
  <button>Reading Style</button>
  <button>Language Preference</button>
  <button onclick="alert('Resume from last position')">Resume</button>
  <button>Discussion Forums — Pro</button>
  <button>Suggest to Creator</button>
  <div class="deep">
    Support the project<br>
    UPI: jayanthedara1@ybl<br>
    <small>₹10 / ₹15 · Other modes coming soon</small>
  </div>
</div>

<script>
const chapters = {
  1: {
    title: "Adhyaya 1 · Anukramanika",
    location: "Adi Parva · Adhyaya 1",
    progress: 8,
    blocks: [
      { visual: "[Anime / Manga / Cartoon prompt: Sauti arriving at Naimisha forest satra, sages seated under trees]",
        sa: "नारायणं नमस्कृत्य नरं चैव नरोत्तमम्।\nदेवीं सरस्वतीं चैव ततो जयमुदीरयेत् ॥",
        en: "Having bowed to Narayana and Nara the foremost of men, and to the goddess Sarasvati, then let Jaya be uttered.",
        te: "నారాయణుని, నరోత్తమునైన నరుని, సరస్వతిని నమస్కరించి తరువాత जयను ఉదీరించవలి." },
      { visual: "[Prompt: Sages welcoming Ugrasrava, twelve-year satra atmosphere]",
        sa: "",
        en: "Ugrasrava, son of Lomaharshana, approached the great sages in the Naimisha forest and was requested to narrate the great Bharata.",
        te: "నైమిషారణ్యంలో శ౗నక కులపతి సత్రంలో ఉగ్రశ్రవుడు వినయముగా వచ్చి మహాభారతను అడిగారు." }
    ]
  }
};

let currentMode = 'anime';
let currentLang = 'all';
let currentChapter = 1;

function render() {
  const ch = chapters[currentChapter];
  document.getElementById('location').textContent = ch.location;
  document.getElementById('progress-text').textContent = `Progress ${ch.progress}%`;
  document.getElementById('pfill').style.width = ch.progress + '%';

  let html = `<div class="episode"><h2>${ch.title}</h2>`;
  ch.blocks.forEach(b => {
    html += `<div class="visual-slot">${b.visual}<br><small>Mode: ${currentMode}</small></div>`;
    if (currentLang === 'all' || currentLang === 'sa') html += `<p class="sa">${b.sa}</p>`;
    if (currentLang === 'all' || currentLang === 'en') html += `<p style="margin-top:10px">${b.en}</p>`;
    if (currentLang === 'all' || currentLang === 'te') html += `<p class="te" style="margin-top:10px">${b.te}</p>`;
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;

  // save progress
  localStorage.setItem('mb_progress', JSON.stringify({ chapter: currentChapter, mode: currentMode, lang: currentLang }));
}

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('#modes .pill').forEach(p => p.classList.toggle('on', p.dataset.mode === m));
  render();
}
function setLang(l) {
  currentLang = l;
  document.querySelectorAll('#langs .pill').forEach(p => p.classList.toggle('on', p.dataset.lang === l));
  render();
}
function loadChapter(n) {
  if (!chapters[n]) { alert('Coming soon'); return; }
  currentChapter = n;
  closePanels();
  render();
}

function openPanel(side) {
  document.getElementById('overlay').classList.add('on');
  document.getElementById(side).classList.add('on');
}
function closePanels() {
  document.getElementById('overlay').classList.remove('on');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
}

document.querySelectorAll('#modes .pill').forEach(p => p.onclick = () => setMode(p.dataset.mode));
document.querySelectorAll('#langs .pill').forEach(p => p.onclick = () => setLang(p.dataset.lang));

// resume
const saved = localStorage.getItem('mb_progress');
if (saved) {
  const s = JSON.parse(saved);
  currentChapter = s.chapter || 1;
  currentMode = s.mode || 'anime';
  currentLang = s.lang || 'all';
}
render();
</script>
</body>
</html>
