<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Mahabharata</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap');
:root {
  --bg: #0a0908;
  --gold: #e4c07a;
  --cream: #f4efe6;
  --muted: #8a8175;
  --panel: #11100e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--cream); font-family: Inter, system-ui, sans-serif; }

/* INTRO */
#intro {
  position: fixed; inset: 0; z-index: 100;
  background: radial-gradient(ellipse at 50% 60%, #2a160c 0%, #0a0908 70%);
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  transition: opacity 1.2s ease, visibility 1.2s;
}
#intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.embers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.ember {
  position: absolute; width: 2px; height: 2px; background: #ff7a3c; border-radius: 50%;
  animation: rise 5s linear infinite; opacity: 0;
}
@keyframes rise {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
  15% { opacity: 0.7; }
  100% { transform: translateY(-20vh) scale(1.4); opacity: 0; }
}
.hero-title {
  font-family: "Instrument Serif", serif;
  font-size: clamp(4.5rem, 14vw, 9rem);
  font-weight: 400;
  letter-spacing: -0.03em;
  line-height: 0.9;
  color: var(--gold);
  text-align: center;
  animation: titleReveal 4.5s ease forwards;
}
@keyframes titleReveal {
  0% { opacity: 0; transform: scale(0.92) translateY(20px); filter: blur(8px); }
  40% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.04); }
}
.hero-sub {
  margin-top: 1.2rem;
  font-size: 0.85rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0;
  animation: fade 4.5s 0.8s forwards;
}
@keyframes fade { to { opacity: 1; } }

/* APP */
.app { height: 100%; display: flex; flex-direction: column; }
.top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px;
  background: rgba(10,9,8,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(228,192,122,0.12);
}
.logo { font-family: "Instrument Serif", serif; font-size: 1.35rem; color: var(--gold); letter-spacing: -0.02em; }
.icon { background: none; border: none; color: var(--cream); font-size: 1.4rem; cursor: pointer; opacity: 0.8; }
.icon:hover { opacity: 1; }

.main { flex: 1; overflow-y: auto; padding: 28px 22px 100px; }
.progress-wrap { margin-bottom: 28px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.05em; }
.bar { height: 2px; background: #222; }
.bar-fill { height: 100%; background: var(--gold); width: 8%; transition: width .4s; }

.selectors { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  background: transparent;
  border: 1px solid rgba(228,192,122,0.25);
  color: var(--cream);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all .2s;
}
.chip.on, .chip:hover {
  background: var(--gold);
  color: #0a0908;
  border-color: var(--gold);
}

.episode h2 {
  font-family: "Instrument Serif", serif;
  font-size: 2.2rem;
  font-weight: 400;
  color: var(--cream);
  margin-bottom: 6px;
}
.episode .loc { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
.block { margin-bottom: 36px; }
.visual {
  width: 100%;
  aspect-ratio: 16/9;
  background: #161412;
  border-radius: 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 0.8rem;
  text-align: center;
  padding: 20px;
  border: 1px solid #222;
}
.sa { font-family: "Noto Serif Devanagari", serif; font-size: 1.25rem; line-height: 1.7; color: var(--cream); }
.en, .te { margin-top: 14px; line-height: 1.65; color: #ddd; }

/* Panels */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s; }
.overlay.on { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; bottom: 0; width: min(380px, 88vw);
  background: var(--panel);
  z-index: 210;
  padding: 32px 24px;
  overflow-y: auto;
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
  border: 1px solid rgba(228,192,122,0.1);
}
.panel.left { left: 0; transform: translateX(-100%); }
.panel.right { right: 0; transform: translateX(100%); }
.panel.on { transform: translateX(0); }
.panel h3 { font-family: "Instrument Serif", serif; font-size: 1.8rem; color: var(--gold); margin-bottom: 24px; }
.panel button {
  display: block; width: 100%; text-align: left;
  background: none; border: none; color: var(--cream);
  padding: 16px 0;
  border-bottom: 1px solid #222;
  font-size: 1rem;
  cursor: pointer;
}
.panel button:hover { color: var(--gold); }
.deep { margin-top: 48px; font-size: 0.75rem; color: #555; line-height: 1.5; }

.bottom {
  display: flex;
  background: rgba(10,9,8,0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(228,192,122,0.12);
}
.bottom button {
  flex: 1; background: none; border: none; color: var(--muted);
  padding: 16px; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer;
}
.bottom button.on { color: var(--gold); }
</style>
</head>
<body>

<div id="intro">
  <div class="embers" id="embers"></div>
  <div class="hero-title">Mahabharata</div>
  <div class="hero-sub">An Epic Retold</div>
</div>

<div class="app">
  <div class="top">
    <button class="icon" onclick="openP('left')">☰</button>
    <div class="logo">Mahabharata</div>
    <button class="icon" onclick="openP('right')">⋮</button>
  </div>

  <div class="main">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="loc">Adi Parva · Adhyaya 1</span>
        <span id="pct">8%</span>
      </div>
      <div class="bar"><div class="bar-fill" id="fill"></div></div>
    </div>

    <div class="selectors">
      <div class="row" id="modes">
        <button class="chip on" data-m="anime">Anime</button>
        <button class="chip" data-m="manga">Manga</button>
        <button class="chip" data-m="cartoon">Cartoon</button>
        <button class="chip" data-m="short">Short Story</button>
        <button class="chip" data-m="gif">GIF</button>
        <button class="chip" data-m="text">Text</button>
      </div>
      <div class="row" id="langs">
        <button class="chip on" data-l="all">All</button>
        <button class="chip" data-l="sa">Sanskrit</button>
        <button class="chip" data-l="en">English</button>
        <button class="chip" data-l="te">Telugu</button>
      </div>
    </div>

    <div id="episode"></div>
  </div>

  <div class="bottom">
    <button class="on">Read</button>
    <button>Map</button>
    <button>Progress</button>
    <button onclick="openP('right')">More</button>
  </div>
</div>

<div class="overlay" id="ov" onclick="closeP()"></div>
<div class="panel left" id="left">
  <h3>Parvas</h3>
  <button onclick="load(1)">Adhyaya 1 — Naimisha</button>
  <button onclick="load(2)">Adhyaya 2</button>
  <button onclick="load(3)">Adhyaya 3</button>
  <div class="deep">More chapters unlock with progress.</div>
</div>
<div class="panel right" id="right">
  <h3>Experience</h3>
  <button>Reading Mode</button>
  <button>Language</button>
  <button>Resume</button>
  <button>Forums</button>
  <button>Suggestions</button>
  <div class="deep">Support<br>jayanthedara1@ybl<br>₹10 / ₹15</div>
</div>

<script>
const embers = document.getElementById('embers');
for (let i = 0; i < 50; i++) {
  const e = document.createElement('div');
  e.className = 'ember';
  e.style.left = Math.random() * 100 + '%';
  e.style.animationDelay = Math.random() * 4 + 's';
  e.style.animationDuration = (3 + Math.random() * 3) + 's';
  embers.appendChild(e);
}
setTimeout(() => document.getElementById('intro').classList.add('hide'), 4800);

const data = {
  1: {
    title: "Adhyaya 1",
    loc: "Adi Parva · Anukramanika",
    pct: 8,
    blocks: [
      {
        v: "Visual prompt — Sauti approaching the Naimisha satra under ancient trees, sages seated in quiet expectation",
        sa: "नारायणं नमस्कृत्य नरं चैव नरोत्तमम्।\nदेवीं सरस्वतीं चैव ततो जयमुदीरयेत् ॥",
        en: "Having bowed to Narayana and to Nara the foremost of men, and to the goddess Sarasvati, then let Jaya be uttered.",
        te: "నారాయణుని, నరోత్తమునైన నరుని, సరస్వతిని నమస్కరించి తరువాత जयను ఉదీరించవలి."
      },
      {
        v: "Visual prompt — The sages of Naimisha receiving the narrator with calm authority",
        sa: "",
        en: "Ugrasrava approached the sages at the twelve-year sacrifice of Shaunaka and was asked to narrate the history of the Bharatas.",
        te: "నైమిషారణ్యంలో శ౗నక కులపతి సత్రంలో ఉగ్రశ్రవుడు వినయముగా వచ్చి మహాభారతను అడిగారు."
      }
    ]
  }
};

let mode = 'anime', lang = 'all', ch = 1;

function render() {
  const c = data[ch];
  document.getElementById('loc').textContent = c.loc;
  document.getElementById('pct').textContent = c.pct + '%';
  document.getElementById('fill').style.width = c.pct + '%';

  let h = `<div class="episode"><h2>${c.title}</h2><div class="loc">${c.loc}</div>`;
  c.blocks.forEach(b => {
    h += `<div class="block"><div class="visual">${b.v}<br><small>${mode}</small></div>`;
    if (lang === 'all' || lang === 'sa') h += `<p class="sa">${b.sa}</p>`;
    if (lang === 'all' || lang === 'en') h += `<p class="en">${b.en}</p>`;
    if (lang === 'all' || lang === 'te') h += `<p class="te">${b.te}</p>`;
    h += '</div>';
  });
  h += '</div>';
  document.getElementById('episode').innerHTML = h;
  localStorage.setItem('mb', JSON.stringify({ch, mode, lang}));
}

function setM(m) {
  mode = m;
  document.querySelectorAll('#modes .chip').forEach(x => x.classList.toggle('on', x.dataset.m === m));
  render();
}
function setL(l) {
  lang = l;
  document.querySelectorAll('#langs .chip').forEach(x => x.classList.toggle('on', x.dataset.l === l));
  render();
}
function load(n) {
  if (!data[n]) return alert('Coming');
  ch = n; closeP(); render();
}
function openP(s) {
  document.getElementById('ov').classList.add('on');
  document.getElementById(s).classList.add('on');
}
function closeP() {
  document.getElementById('ov').classList.remove('on');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
}

document.querySelectorAll('#modes .chip').forEach(c => c.onclick = () => setM(c.dataset.m));
document.querySelectorAll('#langs .chip').forEach(c => c.onclick = () => setL(c.dataset.l));

const s = localStorage.getItem('mb');
if (s) {
  const o = JSON.parse(s);
  ch = o.ch || 1; mode = o.mode || 'anime'; lang = o.lang || 'all';
}
render();
</script>
</body>
</html>
